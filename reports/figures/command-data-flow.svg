<rect width="1200" height="700" fill="#ffffff"/>
<text x="40" y="48" class="title" text-anchor="start"><tspan x="40" dy="0">How Command and Telemetry Move</tspan></text>
<text x="40" y="78" class="subtitle" text-anchor="start"><tspan x="40" dy="0">Aircraft control stays in the blue lane; remote-mission traffic stays in the green lane.</tspan></text>
<text x="35" y="143" class="section" text-anchor="start"><tspan x="35" dy="0">PLATFORM CONTROL</tspan></text>
<line x1="35" y1="160" x2="1165" y2="160" class="lane"/>
<rect x="55" y="185" width="190" height="78" rx="14" class="box blue"/>
<text x="150.0" y="216" class="box-title" text-anchor="middle"><tspan x="150.0" dy="0">Operator</tspan></text>
<rect x="330" y="185" width="280" height="78" rx="14" class="box blue"/>
<text x="470.0" y="216" class="box-title" text-anchor="middle"><tspan x="470.0" dy="0">Platform Command Receiver</tspan></text>
<rect x="790" y="185" width="230" height="78" rx="14" class="box blue"/>
<text x="905.0" y="216" class="box-title" text-anchor="middle"><tspan x="905.0" dy="0">Flight Controller</tspan></text>
<line x1="245" y1="224" x2="330" y2="224" class="arrow blue" marker-end="url(#arrow-blue)"/>
<text x="287.5" y="174" class="edge-label" text-anchor="middle">Platform Command</text>
<line x1="610" y1="224" x2="790" y2="224" class="arrow blue" marker-end="url(#arrow-blue)"/>
<text x="700.0" y="174" class="edge-label" text-anchor="middle">Control Input</text>
<path d="M 905 263 V 292 H 150 V 263" class="arrow blue dashed" marker-end="url(#arrow-blue)"/>
<text x="528" y="314" class="edge-label" text-anchor="middle"><tspan x="528" dy="0">Health / Status</tspan></text>
<line x1="35" y1="320" x2="1165" y2="320" class="divider"/>
<text x="35" y="366" class="section" text-anchor="start"><tspan x="35" dy="0">RELAYED MISSION TRAFFIC</tspan></text>
<rect x="55" y="405" width="190" height="94" rx="14" class="box white"/>
<text x="150.0" y="436" class="box-title" text-anchor="middle"><tspan x="150.0" dy="0">Ground Control</tspan></text>
<rect x="465" y="405" width="270" height="94" rx="14" class="box green"/>
<text x="600.0" y="436" class="box-title" text-anchor="middle"><tspan x="600.0" dy="0">Relay Payload (Black Box)</tspan></text>
<text x="483" y="466" class="body" text-anchor="start"><tspan x="483" dy="0">No platform data interface</tspan></text>
<rect x="955" y="405" width="190" height="94" rx="14" class="box white"/>
<text x="1050.0" y="436" class="box-title" text-anchor="middle"><tspan x="1050.0" dy="0">Remote UAS</tspan></text>
<line x1="245" y1="438" x2="465" y2="438" class="arrow green" marker-end="url(#arrow-green)"/>
<text x="355.0" y="429.0" class="edge-label" text-anchor="middle">Relayed Command</text>
<line x1="735" y1="438" x2="955" y2="438" class="arrow green" marker-end="url(#arrow-green)"/>
<text x="845.0" y="429.0" class="edge-label" text-anchor="middle">Relayed Command</text>
<line x1="955" y1="477" x2="735" y2="477" class="arrow green dashed" marker-end="url(#arrow-green)"/>
<text x="845.0" y="468.0" class="edge-label" text-anchor="middle">Relayed Telemetry</text>
<line x1="465" y1="477" x2="245" y2="477" class="arrow green dashed" marker-end="url(#arrow-green)"/>
<text x="355.0" y="468.0" class="edge-label" text-anchor="middle">Relayed Telemetry</text>
<text x="600" y="568" class="section" text-anchor="middle"><tspan x="600" dy="0">The aircraft carries the payload but does not process the relayed mission traffic.</tspan></text>
<text x="600" y="600" class="small" text-anchor="middle"><tspan x="600" dy="0">External compatibility, message formats, protocols, frequency, waveform, and data rate are unresolved.</tspan></text>
