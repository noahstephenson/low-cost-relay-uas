<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">How Command and Telemetry Move</title>
<desc id="desc">Which information controls the Relay UAS and which information passes through its payload?</desc>
<metadata>Generated from authoritative model records: OP-001, OP-003, OP-010, CMP-AVN-01, CMP-AVN-04, CMP-COM-01, IX-001, IX-002, IX-003, IX-004, IX-005, IX-009, IFC-EXT-005, IFC-INT-005, IFC-EXT-007</metadata>
<defs>
  <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#435269"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245f9e"/></marker>
