<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">What Happens If the Relay Degrades?</title>
<desc id="desc">How does the architecture distinguish payload degradation from loss of platform control?</desc>
<metadata>View tier: primary. Audience: outsider, project owner, and systems engineer. Generated from authoritative model records: SCN-007, MODE-001, MODE-002, MODE-003, MODE-004, MODE-005, REQ-007, REQ-008, GAP-HAZ-001, GAP-VER-001</metadata>
<defs>
  <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#435269"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245f9e"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#247a52"/></marker>
  <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a6700"/></marker>
</defs>
<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
  .title { font-size: 30px; font-weight: 700; }
  .subtitle { font-size: 17px; fill: #536174; }
  .section { font-size: 20px; font-weight: 700; }
  .box-title { font-size: 19px; font-weight: 700; }
  .body { font-size: 17px; }
  .small { font-size: 15px; fill: #536174; }
  .edge-label { font-size: 16px; font-weight: 700; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  .box { stroke: #435269; stroke-width: 2; fill: #f5f7fa; }
  .box.blue { fill: #e9f2ff; stroke: #245f9e; }
  .box.green { fill: #eaf7f0; stroke: #247a52; }
  .box.amber { fill: #fff4d6; stroke: #9a6700; }
  .box.red { fill: #fdecec; stroke: #b42318; }
  .box.white { fill: #ffffff; }
  .box.future { fill: #ffffff; stroke: #6b7280; stroke-dasharray: 9 7; }
  .platform { fill: #f4f7fb; stroke: #26364d; stroke-width: 2.5; }
  .chip { fill: #ffffff; stroke: #8a97a8; stroke-width: 1.5; }
  .chip.blue { fill: #e9f2ff; stroke: #245f9e; }
  .chip-title { font-size: 16px; font-weight: 700; }
  .payload-black { fill: #26364d; stroke: #172033; stroke-width: 3; }
  .payload-title { font-size: 20px; font-weight: 700; fill: #ffffff; }
  .payload-body { font-size: 16px; fill: #eef3f8; }
  .current-zone { fill: #f2f7ff; stroke: #245f9e; stroke-width: 2.5; }
  .boundary { fill: #ffffff; stroke: #26364d; stroke-width: 3; }
  .group { fill: #f8fafc; stroke: #8a97a8; stroke-width: 1.5; }
  .arrow { stroke: #435269; stroke-width: 3; fill: none; }
  .arrow.blue { stroke: #245f9e; }
  .arrow.green { stroke: #247a52; }
  .arrow.amber { stroke: #9a6700; }
  .arrow.dashed { stroke-dasharray: 10 8; }
  .lane { stroke: #cbd3dd; stroke-width: 1.5; }
  .divider { stroke: #8a97a8; stroke-width: 2; stroke-dasharray: 8 7; }
</style>
<rect width="1200" height="700" fill="#ffffff"/>
<text x="40" y="48" class="title" text-anchor="start"><tspan x="40" dy="0">What Happens If the Relay Degrades?</tspan></text>
<text x="40" y="78" class="subtitle" text-anchor="start"><tspan x="40" dy="0">Relay loss is one branch in the aircraft state story—not detailed flight-control logic.</tspan></text>
<rect x="35" y="160" width="165" height="92" rx="14" class="box neutral"/>
<text x="117.5" y="191" class="box-title" text-anchor="middle"><tspan x="117.5" dy="0">Ground Safe</tspan></text>
<text x="53" y="221" class="body" text-anchor="start"><tspan x="53" dy="0">Arming inhibited</tspan></text>
<rect x="250" y="160" width="165" height="92" rx="14" class="box blue"/>
<text x="332.5" y="191" class="box-title" text-anchor="middle"><tspan x="332.5" dy="0">Transit</tspan></text>
<text x="268" y="221" class="body" text-anchor="start"><tspan x="268" dy="0">Move to station</tspan></text>
<rect x="465" y="160" width="180" height="92" rx="14" class="box green"/>
<text x="555.0" y="191" class="box-title" text-anchor="middle"><tspan x="555.0" dy="0">Station Keeping</tspan></text>
<text x="483" y="221" class="body" text-anchor="start"><tspan x="483" dy="0">Hold relay geometry</tspan></text>
<rect x="695" y="160" width="180" height="92" rx="14" class="box amber"/>
<text x="785.0" y="191" class="box-title" text-anchor="middle"><tspan x="785.0" dy="0">Relay Degraded</tspan></text>
<text x="713" y="221" class="body" text-anchor="start"><tspan x="713" dy="0">Relay service impaired</tspan></text>
<polygon points="1010,145 1140,206 1010,267 880,206" class="box blue"/>
<text x="1010" y="198" class="box-title" text-anchor="middle"><tspan x="1010" dy="0">Platform control</tspan><tspan x="1010" dy="23">still available?</tspan></text>
<text x="225" y="137" class="edge-label" text-anchor="middle"><tspan x="225" dy="0">launch</tspan></text>
<text x="440" y="137" class="edge-label" text-anchor="middle"><tspan x="440" dy="0">station reached</tspan></text>
<text x="670" y="137" class="edge-label" text-anchor="middle"><tspan x="670" dy="0">relay degrades</tspan></text>
<line x1="200" y1="206" x2="250" y2="206" class="arrow blue" marker-end="url(#arrow-blue)"/>
<line x1="415" y1="206" x2="465" y2="206" class="arrow blue" marker-end="url(#arrow-blue)"/>
<line x1="645" y1="206" x2="695" y2="206" class="arrow amber" marker-end="url(#arrow-amber)"/>
<line x1="875" y1="206" x2="880" y2="206" class="arrow blue" marker-end="url(#arrow-blue)"/>
<rect x="900" y="350" width="235" height="105" rx="14" class="box blue"/>
<text x="1017.5" y="381" class="box-title" text-anchor="middle"><tspan x="1017.5" dy="0">Return / Recovery</tspan></text>
<text x="918" y="411" class="body" text-anchor="start"><tspan x="918" dy="0">Recovery intent only</tspan><tspan x="918" dy="23">Criteria remain unresolved</tspan></text>
<rect x="585" y="500" width="270" height="110" rx="14" class="box red"/>
<text x="720.0" y="531" class="box-title" text-anchor="middle"><tspan x="720.0" dy="0">Unresolved Safety Gap</tspan></text>
<text x="603" y="561" class="body" text-anchor="start"><tspan x="603" dy="0">No modeled response for</tspan><tspan x="603" dy="23">impaired platform control</tspan></text>
<line x1="1035" y1="267" x2="1035" y2="350" class="arrow blue" marker-end="url(#arrow-blue)"/>
<text x="1035.0" y="320" class="edge-label" text-anchor="middle">YES</text>
<path d="M 985 267 L 985 290 L 720 290 L 720 500" class="arrow amber" marker-end="url(#arrow-amber)"/>
<text x="845" y="282" class="edge-label" text-anchor="middle"><tspan x="845" dy="0">NO / IMPAIRED</tspan></text>
<path d="M 555 252 L 555 325 L 875 325 L 875 402 L 900 402" class="arrow blue dashed" marker-end="url(#arrow-blue)"/>
<text x="700" y="317" class="edge-label" text-anchor="middle"><tspan x="700" dy="0">normal end / low battery</tspan></text>
<path d="M 1018 455 V 640 H 20 V 206 H 35" class="arrow blue" marker-end="url(#arrow-blue)"/>
<text x="555" y="630" class="edge-label" text-anchor="middle"><tspan x="555" dy="0">land, recover, and return to Ground Safe</tspan></text>
<text x="40" y="405" class="section" text-anchor="start"><tspan x="40" dy="0">Defined:</tspan></text>
<text x="40" y="435" class="body" text-anchor="start"><tspan x="40" dy="0">• Independent platform control</tspan><tspan x="40" dy="23">• Degraded and recovery states</tspan><tspan x="40" dy="23">• Normal recovery path</tspan></text>
<text x="40" y="535" class="section" text-anchor="start"><tspan x="40" dy="0">Not yet defined:</tspan></text>
<text x="40" y="565" class="body" text-anchor="start"><tspan x="40" dy="0">• Detection thresholds</tspan><tspan x="40" dy="23">• Recovery criteria and physical behavior</tspan><tspan x="40" dy="23">• Safety acceptance evidence</tspan></text>
</svg>
