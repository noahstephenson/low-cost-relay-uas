<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">What Has This Project Established?</title>
<desc id="desc">Which results are established, conditional, pending, externally blocked, deferred, or not approved?</desc>
<metadata>View tier: primary. Audience: outsider, project owner, and model auditor. Generated from authoritative model records: VER-001, VER-007, VER-008, VER-009, TS-009, CFG-DIG, CFG-SOS, GAP-REC-001, GAP-BUDGET-001, GAP-IFC-001, GAP-VER-001, DEC-001</metadata>
<defs>
