<text x="40" y="48" class="title" text-anchor="start"><tspan x="40" dy="0">What Has This Project Established?</tspan></text>
<text x="40" y="78" class="subtitle" text-anchor="start"><tspan x="40" dy="0">Completed architecture work, deliberate scope limits, and missing real-world evidence are different things.</tspan></text>
