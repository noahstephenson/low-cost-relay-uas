<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">What Is On the Relay UAS?</title>
<desc id="desc">What are the major physical subsystem groups?</desc>
<metadata>View tier: primary. Audience: outsider and systems engineer. Generated from authoritative model records: CMP-AFR-01, CMP-PRP-01, CMP-PWR-01, CMP-AVN-01, CMP-MNT-01, CMP-COM-01</metadata>
<defs>
  <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#435269"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245f9e"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#247a52"/></marker>
  <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a6700"/></marker>
</defs>
<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
  .title { font-size: 30px; font-weight: 700; }
  .subtitle { font-size: 17px; fill: #536174; }
  .section { font-size: 20px; font-weight: 700; }
  .box-title { font-size: 19px; font-weight: 700; }
  .body { font-size: 17px; }
  .small { font-size: 15px; fill: #536174; }
  .edge-label { font-size: 16px; font-weight: 700; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  .box { stroke: #435269; stroke-width: 2; fill: #f5f7fa; }
  .box.blue { fill: #e9f2ff; stroke: #245f9e; }
  .box.green { fill: #eaf7f0; stroke: #247a52; }
  .box.amber { fill: #fff4d6; stroke: #9a6700; }
  .box.red { fill: #fdecec; stroke: #b42318; }
  .box.white { fill: #ffffff; }
  .box.future { fill: #ffffff; stroke: #6b7280; stroke-dasharray: 9 7; }
  .platform { fill: #f4f7fb; stroke: #26364d; stroke-width: 2.5; }
  .chip { fill: #ffffff; stroke: #8a97a8; stroke-width: 1.5; }
  .chip.blue { fill: #e9f2ff; stroke: #245f9e; }
  .chip-title { font-size: 16px; font-weight: 700; }
  .payload-black { fill: #26364d; stroke: #172033; stroke-width: 3; }
  .payload-title { font-size: 20px; font-weight: 700; fill: #ffffff; }
  .payload-body { font-size: 16px; fill: #eef3f8; }
  .current-zone { fill: #f2f7ff; stroke: #245f9e; stroke-width: 2.5; }
  .boundary { fill: #ffffff; stroke: #26364d; stroke-width: 3; }
  .group { fill: #f8fafc; stroke: #8a97a8; stroke-width: 1.5; }
  .arrow { stroke: #435269; stroke-width: 3; fill: none; }
  .arrow.blue { stroke: #245f9e; }
  .arrow.green { stroke: #247a52; }
  .arrow.amber { stroke: #9a6700; }
  .arrow.dashed { stroke-dasharray: 10 8; }
  .lane { stroke: #cbd3dd; stroke-width: 1.5; }
  .divider { stroke: #8a97a8; stroke-width: 2; stroke-dasharray: 8 7; }
</style>
<rect width="1200" height="700" fill="#ffffff"/>
<text x="40" y="48" class="title" text-anchor="start"><tspan x="40" dy="0">What Is On the Relay UAS?</tspan></text>
<text x="40" y="78" class="subtitle" text-anchor="start"><tspan x="40" dy="0">The vehicle platform surrounds and supports a separate relay-payload black box.</tspan></text>
<rect x="45" y="105" width="1110" height="505" rx="24" class="boundary"/>
<text x="600" y="138" class="section" text-anchor="middle"><tspan x="600" dy="0">RELAY UAS</tspan></text>
<rect x="80" y="160" width="740" height="405" rx="20" class="platform"/>
<text x="450" y="192" class="section" text-anchor="middle"><tspan x="450" dy="0">VEHICLE PLATFORM</tspan></text>
<rect x="110" y="210" width="205" height="130" rx="14" class="box neutral"/>
<text x="212.5" y="241" class="box-title" text-anchor="middle"><tspan x="212.5" dy="0">Propulsion</tspan></text>
<text x="128" y="271" class="body" text-anchor="start"><tspan x="128" dy="0">Controlled lift</tspan><tspan x="128" dy="23">Controllers •</tspan><tspan x="128" dy="23">motors • propellers</tspan></text>
<rect x="347" y="210" width="205" height="130" rx="14" class="box amber"/>
<text x="449.5" y="241" class="box-title" text-anchor="middle"><tspan x="449.5" dy="0">Electrical Power</tspan></text>
<text x="365" y="271" class="body" text-anchor="start"><tspan x="365" dy="0">Energy storage and</tspan><tspan x="365" dy="23">distribution</tspan><tspan x="365" dy="23">Battery • bus •</tspan><tspan x="365" dy="23">regulators</tspan></text>
<rect x="585" y="210" width="205" height="130" rx="14" class="box blue"/>
<text x="687.5" y="241" class="box-title" text-anchor="middle"><tspan x="687.5" dy="0">Flight Avionics</tspan></text>
<text x="603" y="271" class="body" text-anchor="start"><tspan x="603" dy="0">Stabilize •</tspan><tspan x="603" dy="23">navigate • hold</tspan><tspan x="603" dy="23">Health and</tspan><tspan x="603" dy="23">recovery support</tspan></text>
<rect x="110" y="375" width="275" height="110" rx="14" class="box blue"/>
<text x="247.5" y="406" class="box-title" text-anchor="middle"><tspan x="247.5" dy="0">Platform Communications</tspan></text>
<text x="128" y="436" class="body" text-anchor="start"><tspan x="128" dy="0">Independent aircraft command</tspan><tspan x="128" dy="23">Health / status return</tspan></text>
<rect x="430" y="375" width="360" height="110" rx="14" class="box neutral"/>
<text x="610.0" y="406" class="box-title" text-anchor="middle"><tspan x="610.0" dy="0">Payload Support</tspan></text>
<text x="448" y="436" class="body" text-anchor="start"><tspan x="448" dy="0">Mechanical retention</tspan><tspan x="448" dy="23">Regulated payload power</tspan></text>
<rect x="110" y="515" width="680" height="48" rx="14" class="box neutral"/>
<text x="450.0" y="546" class="box-title" text-anchor="middle"><tspan x="450.0" dy="0">Airframe and Structure</tspan></text>
<rect x="875" y="270" width="235" height="210" rx="18" class="payload-black"/>
<text x="992.5" y="313" class="payload-title" text-anchor="middle"><tspan x="992.5" dy="0">RELAY PAYLOAD</tspan></text>
<text x="992.5" y="342" class="payload-title" text-anchor="middle"><tspan x="992.5" dy="0">BLACK BOX</tspan></text>
<text x="992.5" y="385" class="payload-body" text-anchor="middle"><tspan x="992.5" dy="0">Relays command</tspan></text>
<text x="992.5" y="409" class="payload-body" text-anchor="middle"><tspan x="992.5" dy="0">and telemetry</tspan></text>
<text x="992.5" y="451" class="payload-body" text-anchor="middle"><tspan x="992.5" dy="0">Internal design undefined</tspan></text>
<line x1="790" y1="407" x2="875" y2="407" class="arrow amber" marker-end="url(#arrow-amber)"/>
<text x="748" y="365" class="small" text-anchor="middle"><tspan x="748" dy="0">regulated power</tspan></text>
<line x1="790" y1="455" x2="875" y2="455" class="arrow"/>
<text x="750" y="510" class="small" text-anchor="middle"><tspan x="750" dy="0">mechanical retention</tspan></text>
<text x="600" y="645" class="section" text-anchor="middle"><tspan x="600" dy="0">Only regulated power and mechanical retention cross from platform to payload.</tspan></text>
<text x="600" y="675" class="small" text-anchor="middle"><tspan x="600" dy="0">Hardware, geometry, ratings, and fabrication remain unresolved.</tspan></text>
</svg>
