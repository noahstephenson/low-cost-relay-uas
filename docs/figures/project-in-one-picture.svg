<text x="302.5" y="206" class="edge-label" text-anchor="middle">Platform command</text>
<line x1="385" y1="258" x2="220" y2="258" class="arrow blue dashed" marker-end="url(#arrow-blue)"/>
<text x="302.5" y="282" class="edge-label" text-anchor="middle">Health / status</text>
<line x1="265" y1="463" x2="500" y2="463" class="arrow green" marker-end="url(#arrow-green)"/>
<text x="382.5" y="443" class="edge-label" text-anchor="middle">Relayed command</text>
