<text x="127.5" y="221" class="box-title" text-anchor="middle"><tspan x="127.5" dy="0">Operator</tspan></text>
<text x="127.5" y="255" class="small" text-anchor="middle"><tspan x="127.5" dy="0">Controls / monitors</tspan></text>
<rect x="45" y="415" width="220" height="110" rx="14" class="box white"/>
<text x="155.0" y="446" class="box-title" text-anchor="middle"><tspan x="155.0" dy="0">Ground Control</tspan></text>
<text x="63" y="476" class="body" text-anchor="start"><tspan x="63" dy="0">Remote-UAS command</tspan><tspan x="63" dy="23">and return telemetry</tspan></text>
<rect x="960" y="415" width="195" height="110" rx="14" class="box white"/>
<text x="1057.5" y="446" class="box-title" text-anchor="middle"><tspan x="1057.5" dy="0">Remote UAS</tspan></text>
<text x="978" y="476" class="body" text-anchor="start"><tspan x="978" dy="0">Receives command</tspan><tspan x="978" dy="23">Returns telemetry</tspan></text>
