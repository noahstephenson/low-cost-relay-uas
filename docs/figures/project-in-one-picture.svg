<rect width="1200" height="700" fill="#ffffff"/>
<text x="40" y="48" class="title" text-anchor="start"><tspan x="40" dy="0">How the Relay UAS Extends Communications</tspan></text>
<text x="40" y="78" class="subtitle" text-anchor="start"><tspan x="40" dy="0">Architecture intent: carrier control and relayed mission traffic use separate logical paths.</tspan></text>
