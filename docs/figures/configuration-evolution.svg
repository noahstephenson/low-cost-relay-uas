<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">What Is Reference, Current, and Future?</title>
<desc id="desc">How do the evidence reference, current candidates, and future branches differ?</desc>
<metadata>View tier: reference. Audience: outsider and systems engineer. Generated from authoritative model records: CFG-REC, CFG-REP, CFG-DOM, CFG-DIG, CFG-SOS</metadata>
<defs>
  <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#435269"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245f9e"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#247a52"/></marker>
  <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a6700"/></marker>
</defs>
<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
  .title { font-size: 30px; font-weight: 700; }
  .subtitle { font-size: 17px; fill: #536174; }
  .section { font-size: 20px; font-weight: 700; }
  .box-title { font-size: 19px; font-weight: 700; }
  .body { font-size: 17px; }
  .small { font-size: 15px; fill: #536174; }
  .edge-label { font-size: 16px; font-weight: 700; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  .box { stroke: #435269; stroke-width: 2; fill: #f5f7fa; }
  .box.blue { fill: #e9f2ff; stroke: #245f9e; }
  .box.green { fill: #eaf7f0; stroke: #247a52; }
  .box.amber { fill: #fff4d6; stroke: #9a6700; }
  .box.red { fill: #fdecec; stroke: #b42318; }
  .box.white { fill: #ffffff; }
  .box.future { fill: #ffffff; stroke: #6b7280; stroke-dasharray: 9 7; }
  .platform { fill: #f4f7fb; stroke: #26364d; stroke-width: 2.5; }
  .chip { fill: #ffffff; stroke: #8a97a8; stroke-width: 1.5; }
  .chip.blue { fill: #e9f2ff; stroke: #245f9e; }
  .chip-title { font-size: 16px; font-weight: 700; }
  .payload-black { fill: #26364d; stroke: #172033; stroke-width: 3; }
  .payload-title { font-size: 20px; font-weight: 700; fill: #ffffff; }
  .payload-body { font-size: 16px; fill: #eef3f8; }
  .current-zone { fill: #f2f7ff; stroke: #245f9e; stroke-width: 2.5; }
  .boundary { fill: #ffffff; stroke: #26364d; stroke-width: 3; }
  .group { fill: #f8fafc; stroke: #8a97a8; stroke-width: 1.5; }
  .arrow { stroke: #435269; stroke-width: 3; fill: none; }
  .arrow.blue { stroke: #245f9e; }
  .arrow.green { stroke: #247a52; }
  .arrow.amber { stroke: #9a6700; }
  .arrow.dashed { stroke-dasharray: 10 8; }
  .lane { stroke: #cbd3dd; stroke-width: 1.5; }
  .divider { stroke: #8a97a8; stroke-width: 2; stroke-dasharray: 8 7; }
</style>
<rect width="1200" height="700" fill="#ffffff"/>
<text x="40" y="48" class="title" text-anchor="start"><tspan x="40" dy="0">What Is Reference, Current, and Future?</tspan></text>
<text x="40" y="78" class="subtitle" text-anchor="start"><tspan x="40" dy="0">The current design space is primary; reference evidence and future concepts remain separate.</tspan></text>
<text x="145" y="145" class="section" text-anchor="middle"><tspan x="145" dy="0">REFERENCE EVIDENCE</tspan></text>
<rect x="40" y="175" width="220" height="180" rx="14" class="box white"/>
<text x="150.0" y="206" class="box-title" text-anchor="middle"><tspan x="150.0" dy="0">Recovered Reference</tspan></text>
<text x="58" y="236" class="body" text-anchor="start"><tspan x="58" dy="0">Describes teardown</tspan><tspan x="58" dy="23">evidence</tspan><tspan x="58" dy="23">Incomplete reconstruction</tspan><tspan x="58" dy="23">Not a design baseline</tspan></text>
<rect x="315" y="115" width="555" height="440" rx="22" class="current-zone"/>
<text x="592.5" y="150" class="section" text-anchor="middle"><tspan x="592.5" dy="0">CURRENT DESIGN SPACE</tspan></text>
<text x="592.5" y="177" class="small" text-anchor="middle"><tspan x="592.5" dy="0">Architecture under study—not approved</tspan></text>
<rect x="360" y="215" width="465" height="135" rx="14" class="box blue"/>
<text x="592.5" y="246" class="box-title" text-anchor="middle"><tspan x="592.5" dy="0">Functional Replica Candidate</tspan></text>
<text x="378" y="276" class="body" text-anchor="start"><tspan x="378" dy="0">Current proposed architecture</tspan><tspan x="378" dy="23">Reproduces roles—not exact hardware</tspan></text>
<rect x="430" y="395" width="325" height="110" rx="14" class="box blue"/>
<text x="592.5" y="426" class="box-title" text-anchor="middle"><tspan x="592.5" dy="0">Domestic Candidate</tspan></text>
<text x="448" y="456" class="body" text-anchor="start"><tspan x="448" dy="0">Current sourcing variant</tspan><tspan x="448" dy="23">Policy and substitutions unresolved</tspan></text>
<line x1="592.5" y1="350" x2="592.5" y2="395" class="arrow blue" marker-end="url(#arrow-blue)"/>
<text x="592.5" y="382" class="edge-label" text-anchor="middle">current variant</text>
<text x="1035" y="145" class="section" text-anchor="middle"><tspan x="1035" dy="0">FUTURE CONCEPTS</tspan></text>
<rect x="930" y="180" width="220" height="125" rx="14" class="box future"/>
<text x="1040.0" y="211" class="box-title" text-anchor="middle"><tspan x="1040.0" dy="0">Digital Extension</tspan></text>
<text x="948" y="241" class="body" text-anchor="start"><tspan x="948" dy="0">Payload management</tspan><tspan x="948" dy="23">and multi-platform branch</tspan></text>
<rect x="930" y="365" width="220" height="125" rx="14" class="box future"/>
<text x="1040.0" y="396" class="box-title" text-anchor="middle"><tspan x="1040.0" dy="0">System-of-Systems</tspan></text>
<text x="948" y="426" class="body" text-anchor="start"><tspan x="948" dy="0">Ground vehicles,</tspan><tspan x="948" dy="23">radio users,</tspan><tspan x="948" dy="23">services, and authorities</tspan></text>
<line x1="260" y1="265" x2="315" y2="265" class="arrow neutral dashed" marker-end="url(#arrow-neutral)"/>
<text x="287.5" y="245" class="edge-label" text-anchor="middle">informs only</text>
<line x1="870" y1="265" x2="930" y2="242" class="arrow neutral dashed" marker-end="url(#arrow-neutral)"/>
<text x="900.0" y="225" class="edge-label" text-anchor="middle">possible later work</text>
<line x1="1040" y1="305" x2="1040" y2="365" class="arrow neutral dashed" marker-end="url(#arrow-neutral)"/>
<text x="600" y="620" class="section" text-anchor="middle"><tspan x="600" dy="0">Reference correspondence is not inheritance; future concepts do not change the current candidate.</tspan></text>
<text x="600" y="654" class="small" text-anchor="middle"><tspan x="600" dy="0">No configuration shown here is an approved technical baseline.</tspan></text>
</svg>
