name: Validate Baseline

on:
  push:
  pull_request:

jobs:
  validate-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate consolidated model and generated views
        run: python scripts/validate-baseline.py --check-generated
