name: Validate Baseline

on:
  push:
  pull_request:

jobs:
  validate-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scientific regression tests
        run: python -B -m unittest discover -s tests -v

      - name: Validate consolidated model and generated views
        run: python scripts/validate-baseline.py --check-generated

      - name: Check carrier calibration is current
        run: python -B analysis/calibration/calibrate_carrier.py --check

      - name: Check calibration boundaries are current
        run: python -B analysis/calibration/boundaries.py --check

      - name: Check calibration sensitivity results are current
        run: python -B analysis/calibration/sensitivity.py --check

      - name: Check feasibility outputs are current
        run: python -B analysis/feasibility.py --check

      - name: Check mission-connectivity outputs are current
        run: python -B analysis/mission_connectivity.py --check

      - name: Check manuscript evidence is current
        run: python -B docs/reference/check-manuscript-evidence.py
